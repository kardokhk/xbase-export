[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xbase-export"
version = "0.1.0"
description = "Read-only, validated export of dBase / FoxPro / Visual FoxPro databases to CSV, SQLite and PostgreSQL"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["dbfread==2.0.7", "openpyxl>=3.1"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
xbase-export = "xbase_export.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
